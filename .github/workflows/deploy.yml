name: Deploy Frontend SSR to GHCR

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  # Asegúrate de usar minúsculas para el nombre de la imagen
  IMAGE_NAME: benitojimenez/frontend 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Preparamos Node.js en el entorno de GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 2. Instalamos dependencias y compilamos
      - name: Install and Build SSR
        run: |
          npm ci
          npm run build:ssr
        # NOTA: Asegúrate que 'build:ssr' existe en tu package.json
        # Si usas Angular nuevo (v17+), a veces es solo 'ng build' (si habilitaste hydratation)

      # 3. Login en Docker
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construir imagen (usando los archivos de dist/ generados arriba)
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/bettjim
            
            # Login para poder bajar la imagen privada
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Bajamos la nueva imagen
            # IMPORTANTE: Asegúrate que en docker-compose.yml el servicio se llame 'frontend'
            # y la imagen coincida con 'ghcr.io/benitojimenez/frontend:latest'
            docker compose pull frontend
            
            # Reiniciamos solo el frontend
            docker compose up -d frontend
            
            # Limpieza de imágenes viejas
            docker image prune -f
