<div class="form-floating custom-select-container" [class.is-open]="isOpen()" [class.disabled]="disabled()">
  
  <input 
    type="text" 
    [value]="selectedName" 
    readonly 
    placeholder=" " 
    (click)="toggleDropdown()"
    [disabled]="disabled()"
  />
  <label>{{ label() }}</label>
  
  <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>

  <div class="custom-dropdown-menu">
    
    <div class="search-wrapper" (click)="$event.stopPropagation()">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Buscar..." 
        [value]="searchQuery()"
        (input)="onSearch($event)"
      />
    </div>

    <div class="options-wrapper">
      @for (opt of (filteredOptions() || []); track opt.id) {
        <div 
          class="custom-option" 
          [class.selected]="selectedId() === opt.id"
          (click)="selectOption(opt)"
        >
          <div class="option-label">
            <svg class="location-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span class="option-text">{{ opt.name }}</span>
          </div>

          @if (selectedId() === opt.id) {
            <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#FF2E63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          }
        </div>
      } 
      @empty {
        <div class="no-results">
          No se encontraron resultados
        </div>
      }
    </div>
  </div>
</div>
