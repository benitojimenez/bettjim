@if (isVisible()) {
  <div class="cookie-card fade-in-up">
    
    <div class="cookie-header">
      <div class="icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"></path>
          <line x1="8.5" y1="14.5" x2="8.5" y2="14.51" stroke-width="3"></line>
          <line x1="16" y1="14.5" x2="16" y2="14.51" stroke-width="3"></line>
          <line x1="11" y1="9.5" x2="11" y2="9.51" stroke-width="3"></line>
          <line x1="12" y1="17" x2="12" y2="17.51" stroke-width="3"></line>
        </svg>
      </div>
      <div class="text-content">
        <h3>Tu privacidad nos importa</h3>
        <p>
          Usamos cookies para mejorar tu experiencia y analizar el tráfico. 
          Al continuar, aceptas nuestra <a routerLink="/privacy">Política de Privacidad</a>.
        </p>
      </div>
    </div>

    <div class="cookie-actions">
      <button class="btn-ghost" (click)="decline()">Rechazar</button>
      <button class="btn-primary" (click)="accept()">Aceptar Todas</button>
    </div>

  </div>
}
