<header class="mobile-header-bar">
  <div class="logo-area">
    <a routerLink="/" class="logo">Bettjim.com</a>
  </div>

  <button class="mobile-summary-trigger" (click)="toggleSummary()" [attr.aria-expanded]="mobileSummaryOpen()">
    <span class="trigger-label">
      <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      {{ mobileSummaryOpen() ? 'Ocultar' : 'Mostrar' }} resumen de compra
      <svg class="chevron-icon" [class.rotated]="mobileSummaryOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
    <span class="trigger-total">S/ 240.00</span>
  </button>

  <div class="mobile-summary-panel" [class.open]="mobileSummaryOpen()">
    <div class="panel-content">
      <app-order-summary></app-order-summary>
    </div>
  </div>
</header>

<div class="split-viewport">

  <main class="left-pane">
    <div class="pane-content">
      
      <header class="desktop-header">
        <a routerLink="/" class="logo">Bettjim.</a>
      </header>

      <div class="form-area fade-in-up">
        <router-outlet></router-outlet>
      </div>
      
    </div>
  </main>

  <aside class="right-pane">
    <div class="pane-content sticky-content fade-in-left">
      
      <app-order-summary></app-order-summary>
      
      <div class="trust-badge">
        <div class="icon-lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="text">
          <p class="title">Pago 100% Seguro</p>
          <p class="subtitle">Tus datos están protegidos con encriptación de 256-bits.</p>
        </div>
      </div>

    </div>
  </aside>

</div>
